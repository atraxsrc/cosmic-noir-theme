# Noir colour scheme for qt5ct / qt6ct, part of cosmic-noir-theme (MIT).
# Charcoal windows, soot buttons and tooltips, fog text, orange highlight
# with charcoal text on it, muted placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Noir, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#ccd0cf, #222222, #525252, #3a3b3a, #101010, #2a2a2a, #ccd0cf, #dadedd, #ccd0cf, #101010, #171717, #101010, #f25623, #171717, #f25623, #f56e0f, #222222, #171717, #222222, #ccd0cf, #7d837d
disabled_colors=#686c69, #222222, #525252, #3a3b3a, #101010, #2a2a2a, #686c69, #959c95, #686c69, #171717, #171717, #101010, #525252, #959c95, #7d837d, #7d837d, #222222, #171717, #222222, #ccd0cf, #525252
inactive_colors=#ccd0cf, #222222, #525252, #3a3b3a, #101010, #2a2a2a, #ccd0cf, #dadedd, #ccd0cf, #101010, #171717, #101010, #f25623, #171717, #f25623, #f56e0f, #222222, #171717, #222222, #ccd0cf, #7d837d
