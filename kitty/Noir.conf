# Noir for kitty, part of cosmic-noir-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/Noir-term.ron).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Noir.conf

foreground              #CCD0CF
background              #171717
selection_foreground    none
selection_background    #3A3B3A

cursor                  #F25623
cursor_text_color       #171717

url_color               #AEAB94
url_style               curly

active_border_color     #F25623
inactive_border_color   #525252
bell_border_color       #F56E0F

active_tab_foreground   #171717
active_tab_background   #F25623
inactive_tab_foreground #959C95
inactive_tab_background #222222
tab_bar_background      #171717

mark1_foreground        #171717
mark1_background        #88A57D
mark2_foreground        #171717
mark2_background        #AEAB94
mark3_foreground        #171717
mark3_background        #F56E0F

# black
color0  #101010
color8  #525252
# red: orange
color1  #F25623
color9  #F56E0F
# green: sage
color2  #88A57D
color10 #A3BC98
# yellow: khaki
color3  #AEAB94
color11 #C9C6B2
# blue: ember
color4  #F56E0F
color12 #F56E0F
# magenta: ember / amber
color5  #F56E0F
color13 #F0913A
# cyan: grey-sage
color6  #7B837B
color14 #959C95
# white: pale / bright fog
color7  #BCBFBC
color15 #DADEDD
